<!doctype html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />

    <!--
      Static fallback only — matches src/data/siteSettings.ts's seoTitle/
      seoDescription/seoImageUrl (or whatever's saved in Firestore's
      siteSettings/main doc) so a crawler/link-preview bot that doesn't run
      JavaScript still sees the real, current values instead of stale
      placeholder copy. Every JS-capable client (a real browser tab,
      Googlebot, Bingbot) overwrites these at runtime with the current
      settings and, on a project page, that project's own SEO override —
      see src/hooks/useDocumentHead.ts.
    -->
    <title>Ronald Filmmaker — Produção audiovisual cinematográfica</title>
    <meta
      name="description"
      content="Produção audiovisual para marcas, casais e empresas que querem ser lembrados, não apenas vistos."
    />

    <link rel="canonical" href="https://ronaldfilmmaker.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ronald Filmmaker" />

    <meta property="og:type" content="website" />

      property="og:description"
      content="Produção audiovisual para marcas, casais e empresas que querem ser lembrados, não apenas vistos."
    />
